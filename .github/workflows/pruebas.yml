name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela el run anterior de la misma rama.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parte-1:
    name: "Parte 1: Hadamard con hilos y con TBB"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar TBB
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtbb-dev

      - name: Compilar, ejecutar y verificar
        run: |
          correr() {
            make hadamard
          }
          verificar() {
            nucleos="$nucleos" bash -eo pipefail <<'VERIFICAR'
          awk '
            {
              for (i = 1; i <= NF; i++) { if ($i == "n") n = $(i + 1); if ($i == "suma") suma = $(i + 1); if ($i == "hilos") h = $(i + 1); if ($i == "grano") g = $(i + 1) }
              if (suma + 0 != 36 * n) { printf "linea %d: la suma dio %s y con n = %s debia dar %.0f\n", NR, suma, n, 36 * n; mal = 1 }
              if ($1 == "hilos" && n == 100000000) th[h] = $5
              if ($1 == "tbb" && n == 100000000 && g == 1) tt[h] = $8
            }
            END {
              if (NR < 16) { print "faltan lineas en hadamard.txt: se esperaban 16 y hay " NR; exit 1 }
              if (mal) exit 1
              printf "std::thread, n = 1e8: 1 hilo %s ms, 4 hilos %s ms\n", th[1], th[4]
              printf "TBB, n = 1e8: 1 hilo %s ms, 4 hilos %s ms\n", tt[1], tt[4]
              if (th[4] + 0 > 0.85 * th[1]) { print "con std::thread, cuatro hilos no bajaron el tiempo de uno: el reparto no esta ocurriendo"; exit 1 }
              if (tt[4] + 0 > 0.85 * tt[1]) { print "con TBB, cuatro hilos no bajaron el tiempo de uno: el reparto no esta ocurriendo"; exit 1 }
            }
          ' hadamard.txt
          VERIFICAR
          }
          correr
          if ! salida=$(verificar 2>&1); then
            echo "$salida"; echo "::notice title=Parte 1::segunda corrida antes de marcar rojo"
            correr
            salida=$(verificar 2>&1) || { echo "$salida"; echo "::error file=hadamard_hilos.cpp,title=Parte 1::$(echo "$salida" | tail -1)"; exit 1; }
          fi
          echo "$salida"

      - name: Resumen
        if: always()
        run: |
          { echo "### Parte 1: Hadamard con hilos y con TBB"; echo '```'; cat hadamard.txt 2>/dev/null || echo "sin salida de hadamard.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  parte-2:
    name: "Parte 2: balanceo de carga"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compilar, ejecutar y verificar
        run: |
          correr() {
            TIMEFORMAT='%R %U %S'
            { time make balanceo 2>&1 | tee salida.log; } 2> tiempo.txt
            read -r real user sys < tiempo.txt
            nucleos=$(awk -v r="$real" -v u="$user" -v s="$sys" 'BEGIN { printf "%.2f", (u + s) / r }')
            echo "cpu / reloj: ${nucleos}  (reloj ${real} s, cpu $(awk -v u="$user" -v s="$sys" 'BEGIN { printf "%.1f", u + s }') s)" | tee cpu.txt
          }
          verificar() {
            nucleos="$nucleos" bash -eo pipefail <<'VERIFICAR'
          awk '
            $1 == "creciente" { c[$2] = $3; tc[$2] = $NF }
            $1 == "periodico" { p[$2] = $3; tp[$2] = $NF }
            END {
              for (r in tc) if (tc[r] != 1651577046) { print "creciente " r ": total " tc[r] ", debia ser 1651577046"; mal = 1 }
              for (r in tp) if (tp[r] != 1702399936) { print "periodico " r ": total " tp[r] ", debia ser 1702399936"; mal = 1 }
              if (!("demanda" in c) || !("turnos" in c)) { print "faltan lineas en balanceo.txt"; exit 1 }
              if (mal) exit 1
              printf "creciente: bloques %s ms, turnos %s ms, demanda %s ms\n", c["bloques"], c["turnos"], c["demanda"]
              printf "periodico: bloques %s ms, turnos %s ms, demanda %s ms\n", p["bloques"], p["turnos"], p["demanda"]
              if (c["demanda"] + 0 > c["bloques"] + 0) { print "con el patron creciente, el reparto por demanda tardo mas que los bloques contiguos"; exit 1 }
              if (p["demanda"] + 0 > p["turnos"] + 0) { print "con el patron periodico, el reparto por demanda tardo mas que los turnos"; exit 1 }
              if (c["turnos"] + 0 > c["bloques"] + 0) { print "con el patron creciente, el reparto por turnos tardo mas que los bloques contiguos"; exit 1 }
            }
          ' balanceo.txt
          awk -v n="$nucleos" 'BEGIN { if (n + 0 < 1.4) { print "el programa uso " n " nucleos en promedio: los repartos no estan corriendo en varios hilos"; exit 1 } }'
          VERIFICAR
          }
          correr
          if ! salida=$(verificar 2>&1); then
            echo "$salida"; echo "::notice title=Parte 2::segunda corrida antes de marcar rojo"
            correr
            salida=$(verificar 2>&1) || { echo "$salida"; echo "::error file=balanceo.cpp,title=Parte 2::$(echo "$salida" | tail -1)"; exit 1; }
          fi
          echo "$salida"

      - name: Resumen
        if: always()
        run: |
          { echo "### Parte 2: balanceo de carga"; echo '```'; cat balanceo.txt 2>/dev/null || echo "sin salida de balanceo.txt"; cat cpu.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  parte-3:
    name: "Parte 3: el máximo por divide y vencerás"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compilar, ejecutar y verificar
        run: |
          correr() {
            make maximo
          }
          verificar() {
            nucleos="$nucleos" bash -eo pipefail <<'VERIFICAR'
          awk '
            {
              for (i = 1; i <= NF; i++) if ($i == "max") m = $(i + 1)
              if (m != 2147483646) { printf "linea %d: el maximo dio %s y debia dar 2147483646\n", NR, m; mal = 1 }
              if ($1 == "secuencial") base = $2
              if ($1 == "prof" && $2 == 2) cuatro = $5
            }
            END {
              if (NR < 6) { print "faltan filas en maximo.txt: se esperaban 6 y hay " NR; exit 1 }
              if (mal) exit 1
              printf "secuencial %s ms, cuatro hilos %s ms\n", base, cuatro
              if (cuatro + 0 > 0.8 * base) { print "con cuatro hilos el maximo no salio mas rapido que en secuencial: revise que la mitad izquierda corra en otro hilo"; exit 1 }
            }
          ' maximo.txt
          VERIFICAR
          }
          correr
          if ! salida=$(verificar 2>&1); then
            echo "$salida"; echo "::notice title=Parte 3::segunda corrida antes de marcar rojo"
            correr
            salida=$(verificar 2>&1) || { echo "$salida"; echo "::error file=maximo.cpp,title=Parte 3::$(echo "$salida" | tail -1)"; exit 1; }
          fi
          echo "$salida"

      - name: Resumen
        if: always()
        run: |
          { echo "### Parte 3: el máximo por divide y vencerás"; echo '```'; cat maximo.txt 2>/dev/null || echo "sin salida de maximo.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  parte-4:
    name: "Parte 4: el máximo acumulado en dos pasadas"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compilar, ejecutar y verificar
        run: |
          correr() {
            TIMEFORMAT='%R %U %S'
            { time make prefijos 2>&1 | tee salida.log; } 2> tiempo.txt
            read -r real user sys < tiempo.txt
            nucleos=$(awk -v r="$real" -v u="$user" -v s="$sys" 'BEGIN { printf "%.2f", (u + s) / r }')
            echo "cpu / reloj: ${nucleos}  (reloj ${real} s, cpu $(awk -v u="$user" -v s="$sys" 'BEGIN { printf "%.1f", u + s }') s)" | tee cpu.txt
          }
          verificar() {
            nucleos="$nucleos" bash -eo pipefail <<'VERIFICAR'
          grep -q "coinciden" prefijos.txt || { echo "las dos versiones no producen la misma serie"; exit 1; }
          sec=$(awk '$1 == "secuencial" {print $2}' prefijos.txt)
          dos=$(awk '$1 == "dos_pasadas" {print $2}' prefijos.txt)
          echo "secuencial: ${sec} ms, dos pasadas: ${dos} ms"
          awk -v s="$sec" -v d="$dos" 'BEGIN { if (d + 0 >= 0.9 * s) { print "la version en dos pasadas no salio mas rapida que la secuencial en este servidor"; exit 1 } }' 
          awk -v n="$nucleos" 'BEGIN { if (n + 0 < 1.4) { print "el programa uso " n " nucleos en promedio: las dos pasadas no estan corriendo en varios hilos"; exit 1 } }'
          VERIFICAR
          }
          correr
          if ! salida=$(verificar 2>&1); then
            echo "$salida"; echo "::notice title=Parte 4::segunda corrida antes de marcar rojo"
            correr
            salida=$(verificar 2>&1) || { echo "$salida"; echo "::error file=prefijos.cpp,title=Parte 4::$(echo "$salida" | tail -1)"; exit 1; }
          fi
          echo "$salida"

      - name: Resumen
        if: always()
        run: |
          { echo "### Parte 4: el máximo acumulado en dos pasadas"; echo '```'; cat prefijos.txt 2>/dev/null || echo "sin salida de prefijos.txt"; cat cpu.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  resumen:
    name: Resumen
    needs: [parte-1, parte-2, parte-3, parte-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Estado de las partes
        run: |
          estado() { case "$1" in success) echo "en verde";; failure) echo "en rojo";; *) echo "$1";; esac; }
          verdes=0
          for r in "${{ needs.parte-1.result }}" "${{ needs.parte-2.result }}" "${{ needs.parte-3.result }}" "${{ needs.parte-4.result }}"; do
            test "$r" = success && verdes=$((verdes + 1))
          done
          {
            echo "## ${verdes} de 4 partes en verde"
            echo
            echo "| Parte | Estado |"
            echo "|---|---|"
            echo "| Parte 1: Hadamard con hilos y con TBB | $(estado "${{ needs.parte-1.result }}") |"
            echo "| Parte 2: balanceo de carga | $(estado "${{ needs.parte-2.result }}") |"
            echo "| Parte 3: el máximo por divide y vencerás | $(estado "${{ needs.parte-3.result }}") |"
            echo "| Parte 4: el máximo acumulado en dos pasadas | $(estado "${{ needs.parte-4.result }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${verdes} de 4 partes en verde"
